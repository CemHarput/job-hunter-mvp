[project]
name = "job-hunter-mvp"
version = "0.1.0"
description = "Evidence-first local job discovery and application tracking"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobhunter*"]
